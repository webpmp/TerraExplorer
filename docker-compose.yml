services:
  terraexplorer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: terraexplorer-dev:latest
    container_name: terraexplorer-dev-container
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    restart: unless-stopped
